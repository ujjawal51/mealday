<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087e4e">
  <title>Mealday</title>
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main id="main" tabindex="-1"><div id="screen" aria-busy="true"><p>Loading your kitchen…</p></div></main>
  <nav class="nav" aria-label="Mealday navigation">
    <button data-view="week"></button>
    <button data-view="recipes"></button>
    <button data-view="cookbook"></button>
    <button data-view="shopping"></button>
    <button data-view="settings"></button>
  </nav>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Mealday needs JavaScript to plan your week.</noscript>
</body>
</html>
