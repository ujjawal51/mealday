<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>Log in · Mealday</title><link rel="icon" href="/brand.svg" type="image/svg+xml"><link rel="stylesheet" href="/account.css"><script src="/account-form.js" type="module"></script></head>
<body data-account-mode="login"><main class="account-shell"><a class="account-back" href="/">Back to Mealday</a><div class="account-brand"><img src="/brand.svg" alt=""><span>mealday<span>.</span></span></div><h1 class="account-heading">Welcome back.</h1><p class="account-description">Your week, your recipes, all in one place.</p><nav class="account-tabs" aria-label="Account access"><a href="/login.html" aria-current="page">Log in</a><a href="/signup.html" >Sign up</a></nav><section class="account-card" aria-label="Log in"><form id="account-form"><fieldset id="account-fields" disabled><div class="account-field"><label for="email">Email address</label><input class="account-input" id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" maxlength="254" required></div><div class="account-field"><label for="password">Password</label><div class="account-password"><input class="account-input" id="password" name="password" type="password" autocomplete="current-password" minlength="1" maxlength="128" required><button type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false">Show</button></div></div></fieldset><p id="account-error" role="alert"></p><button class="account-submit" id="account-submit" type="submit" disabled>Log in</button></form><div id="account-success" role="status" hidden><h2>Your account is ready</h2><p></p><a class="account-continue" href="/">Continue to Mealday</a></div><p id="account-notice" role="status">Checking account connection…</p><button id="account-retry" type="button" hidden>Check connection again</button></section><p class="account-guest"><a href="/">Continue as a guest</a></p><p class="account-footer">Your guest kitchen stays on this device.<br>Sign in to a connected account to sync across devices.</p><noscript>JavaScript is needed to securely check the account service.</noscript></main></body></html>
