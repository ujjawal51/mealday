<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f7f7f5"><title>Choose a new password · Mealday</title><link rel="icon" href="/brand.svg" type="image/svg+xml"><link rel="stylesheet" href="/account.css"><script type="module" src="/email-recovery.js"></script></head>
<body data-recovery-mode="reset"><main class="account-shell"><a class="account-back" href="/login.html">Back to log in</a><div class="account-brand"><img src="/brand.svg" alt=""><span>mealday<span>.</span></span></div><h1 class="account-heading">Choose a new password</h1><p class="account-description">Your reset link works once and expires after 30 minutes.</p><section class="account-card" style="margin-top:24px"><form id="recovery-form"><fieldset id="recovery-fields" disabled><div class="account-field"><label for="password">New password</label><input class="account-input" id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><p class="account-help">Use at least 12 characters.</p></div><div class="account-field"><label for="confirm">Confirm new password</label><input class="account-input" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div></fieldset><p id="account-error" role="alert"></p><button class="account-submit" id="recovery-submit" disabled>Update password</button></form><p id="recovery-status" role="status">Checking email service…</p><a href="/verify-email.html" class="account-help">Resend verification email</a><p class="account-help"><a href="/forgot-password.html">Request a new password reset link</a></p></section><noscript>Enable JavaScript to continue.</noscript></main></body></html>
