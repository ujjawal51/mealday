name: Phone account checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  account-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:phone
      - name: Check committed browser assets
        run: git diff --exit-code -- phone-preview/dist
      - name: Syntax and regression tests
        run: |
          node --check phone-preview/dist/google-signin.js
          node --check phone-preview/server/google-auth.mjs
          node --test phone-preview/server/*.test.mjs
          node phone-preview/source/nutrition.test.mjs
          node phone-preview/scripts/audit-nutrition.mjs --check
          npm run test:kitchen
          node phone-preview/scripts/audit-kitchen-tests.mjs --check
      - name: Start a disposable MongoDB replica set
        run: |
          docker run --detach --name mealday-test-mongo --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec mealday-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec mealday-test-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for attempt in $(seq 1 40); do
            if docker exec mealday-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Disposable MongoDB integration
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: node phone-preview/server/mongo.integration.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --with-deps
      - name: Test the phone onboarding account flow
        run: |
          node phone-preview/server/onboarding-account.browser.mjs
          node phone-preview/server/quick-start.browser.mjs
          node phone-preview/server/store-prices.browser.mjs
          node phone-preview/server/lulu-prices.browser.mjs
          SHOPPING_SCREENSHOT=1 node phone-preview/server/shopping-list.browser.mjs
          PLAN_SCREENSHOT=1 node phone-preview/server/plan-layout.browser.mjs
          RECIPE_SCREENSHOT=1 node phone-preview/server/recipe-detail.browser.mjs
          node phone-preview/server/filter-flow.browser.mjs
          COMPLETE_MEAL_SCREENSHOT=1 node phone-preview/server/complete-meals.browser.mjs
          node phone-preview/server/recipe-image-coverage.browser.mjs
  deployment-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: account-tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the deployed Mealday bundle and database health
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const html=await readFile('phone-preview/dist/index.html','utf8');
          const entry=html.match(/src="\/(client-[a-f0-9]+\.js)"/)[1];
          const origin='https://mealday.onrender.com';
          const externalHeaders={'Sec-Fetch-Site':'cross-site','Sec-Fetch-Mode':'navigate','Sec-Fetch-Dest':'document'};
          let ready=false;
          for(let attempt=0;attempt<30;attempt++){
            try{
              const response=await fetch(origin+'/',{signal:AbortSignal.timeout(10000)});
              if(response.ok&&(await response.text()).includes('/'+entry)){
                const recipes=await fetch(origin+'/api/recipes',{headers:externalHeaders,signal:AbortSignal.timeout(10000)});
                if(recipes.ok&&Array.isArray((await recipes.json()).recipes)){ready=true;break;}
              }
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert(ready,'Render has not served this build within the deployment window.');
          const response=await fetch(origin+'/'+entry,{signal:AbortSignal.timeout(20000)});
          assert(response.ok);
          assert.equal(await response.text(),await readFile('phone-preview/dist/'+entry,'utf8'));
          const health=await fetch(origin+'/api/health',{signal:AbortSignal.timeout(20000)});
          assert(health.ok);assert.equal((await health.json()).database,'connected');
          const luluScript=await fetch(origin+'/lulu-prices.js?v=1',{signal:AbortSignal.timeout(20000)});
          assert(luluScript.ok);assert.equal(await luluScript.text(),await readFile('phone-preview/dist/lulu-prices.js','utf8'));
          const luluStatus=await fetch(origin+'/api/lulu/status',{signal:AbortSignal.timeout(10000)});
          assert(luluStatus.ok);const supplier=await luluStatus.json();
          assert.equal(supplier.provider,'ReefAPI');assert.equal(supplier.locationVerified,false);
          console.log('LULU_CONFIGURED '+supplier.configured+' (configuration only; no paid provider request)');
          const privateRead=await fetch(origin+'/api/account',{headers:externalHeaders,signal:AbortSignal.timeout(10000)});
          assert.equal(privateRead.status,403,'Cross-site private account reads must remain blocked.');
          const catalogue=await (await fetch(origin+'/api/catalogue',{signal:AbortSignal.timeout(20000)})).json();
          assert(catalogue.recipes.every(r=>r.imageUrl&&!r.imageUrl.includes('unavailable')),'Published recipes still have missing images.');
          const assets=JSON.parse(await readFile('phone-preview/source/generated-recipe-images.json','utf8')).images;
          for(let i=0;i<assets.length;i+=3)await Promise.all(assets.slice(i,i+3).map(async asset=>{
            assert.equal(catalogue.recipes.find(r=>r.id===asset.id)?.imageUrl,asset.path);
            const image=await fetch(origin+asset.path,{signal:AbortSignal.timeout(20000)});assert(image.ok);assert.match(image.headers.get('content-type'),/^image\/webp/);
            assert.equal(createHash('sha256').update(Buffer.from(await image.arrayBuffer())).digest('hex'),asset.sha256);
          }));
          console.log('IMAGE_DEPLOYMENT_VERIFIED '+assets.length+' new illustrations; '+catalogue.recipes.length+' published meals have images.');
          console.log('DEPLOYMENT_VERIFIED '+entry+' MongoDB connected; external recipe links allowed; private account reads protected');
          NODE
